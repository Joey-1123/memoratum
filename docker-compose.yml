services:
  memoratum:
    build: .
    ports:
      - "6767:6767"
    environment:
      MEMORATUM_DATA_DIR: /data
      MEMORATUM_API_KEY: ${MEMORATUM_API_KEY:-}
      MEMORATUM_EMBEDDINGS_PROVIDER: ${MEMORATUM_EMBEDDINGS_PROVIDER:-hash}
      MEMORATUM_EMBEDDINGS_ENDPOINT: ${MEMORATUM_EMBEDDINGS_ENDPOINT:-}
      MEMORATUM_EMBEDDINGS_MODEL: ${MEMORATUM_EMBEDDINGS_MODEL:-}
      MEMORATUM_WEBHOOK_ENCRYPTION_KEY: ${MEMORATUM_WEBHOOK_ENCRYPTION_KEY:-}
    volumes:
      - memoratum-data:/data
  worker:
    build: .
    command: ["uv", "run", "--no-dev", "python", "-m", "memoratum.worker"]
    environment:
      MEMORATUM_DATA_DIR: /data
      MEMORATUM_EMBEDDINGS_PROVIDER: ${MEMORATUM_EMBEDDINGS_PROVIDER:-hash}
      MEMORATUM_EMBEDDINGS_ENDPOINT: ${MEMORATUM_EMBEDDINGS_ENDPOINT:-}
      MEMORATUM_EMBEDDINGS_MODEL: ${MEMORATUM_EMBEDDINGS_MODEL:-}
      MEMORATUM_LLM_ENDPOINT: ${MEMORATUM_LLM_ENDPOINT:-}
      MEMORATUM_LLM_MODEL: ${MEMORATUM_LLM_MODEL:-}
      MEMORATUM_LLM_KEY: ${MEMORATUM_LLM_KEY:-}
      MEMORATUM_WORKER_INTERVAL: ${MEMORATUM_WORKER_INTERVAL:-2}
      # The worker decrypts webhook signing secrets, so it needs the same key.
      MEMORATUM_WEBHOOK_ENCRYPTION_KEY: ${MEMORATUM_WEBHOOK_ENCRYPTION_KEY:-}
      MEMORATUM_JOB_LEASE_SECONDS: ${MEMORATUM_JOB_LEASE_SECONDS:-}
      MEMORATUM_RETENTION_DAYS: ${MEMORATUM_RETENTION_DAYS:-0}
    volumes:
      - memoratum-data:/data
    depends_on:
      memoratum:
        condition: service_started

volumes:
  memoratum-data:
