[project]
name = "memoratum"
version = "0.34.0"
description = "Self-hosted context infrastructure for AI agents (AGPL-3.0)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
llm = [
    "litellm>=1.102.1,<2",
]
embeddings = [
    "fastembed>=0.8.1,<1",
]
qdrant = [
    "qdrant-client>=1.19.1,<2",
]
chroma = [
    "chromadb>=1.5.9,<2",
]
pgvector = [
    "psycopg[binary]>=3.3.6,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memoratum"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
