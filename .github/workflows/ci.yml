name: ci
on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run python scripts/check_no_telemetry.py
      - run: MEM0_TELEMETRY=false uv run pytest tests/test_mem0_official_sdk.py -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
  ts-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test --prefix clients/ts
  opencode-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check clients/opencode/memoratum.js
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix dashboard
      - run: npm run build --prefix dashboard
