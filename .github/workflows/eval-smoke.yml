name: eval-smoke

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  harnesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - name: LongMemEval-S smoke
        run: >-
          uv run python -m memoratum.eval_longmemeval
          --data eval/fixtures/longmemeval_smoke.json
          --full --k 1 --modes documents
      - name: LoCoMo-MC10 smoke
        run: >-
          uv run python -m memoratum.eval_mc10
          --data eval/fixtures/locomo_mc10_smoke.json
          --full --k 2
